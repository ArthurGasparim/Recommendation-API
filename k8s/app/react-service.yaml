apiVersion: v1
kind: Service
metadata:
  name: react-frontend-svc
  namespace: dev
  labels:
    app: react-frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  selector:
    app: react-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer