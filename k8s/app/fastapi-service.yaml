apiVersion: v1
kind: Service
metadata:
  name: fastapi-recommender-svc
  namespace: dev
  labels:
    app: fastapi-recommender
    release: monitoring
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  selector:
    app: fastapi-recommender
  ports:
    - name: http-metrics
      protocol: TCP
      port: 80
      targetPort: 5000
  type: LoadBalancer