apiVersion: v1
kind: Service
metadata:
  name: fastapi-recommender-svc
  namespace: dev
  labels:
    app: fastapi-recommender
    release: monitoring
spec:
  selector:
    app: fastapi-recommender
  ports:
    - name: http-metrics
      protocol: TCP
      port: 80
      targetPort: http
  type: ClusterIP
